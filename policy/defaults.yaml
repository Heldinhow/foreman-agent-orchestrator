# The built-in Policy Layer: every behaviour rule Foreman ships with, and the lowest
# precedence of the Policy Layers. Foreman stops if this file is missing or invalid.
#
# Each value here is a Safety Default or a plain default that the Policy Owner can change
# through a Policy Change. Workspace, Project and user-override layers hold only what differs.
schemaVersion: 1
locale: en

# No Adapter or model ships as a default, since Foreman requires no provider.
adapters: {}
models: {}

roles:
  reviewer:
    tools: [read]

pipeline:
  steps:
    - { id: grill, scope: run, access: read-only, prompt: grill }
    - { id: spec, scope: run, access: read-only, prompt: spec, produces: spec }
    - id: tickets
      scope: run
      access: read-only
      prompt: tickets
      produces: tasks
      gates:
        - { type: human }
    - id: implement
      scope: task
      access: write
      prompt: implement
      gates:
        - { type: evidence }
        - { type: diff-check }
    - id: review
      scope: task
      access: read-only
      prompt: review
      role: reviewer
      gates:
        - { type: review-verdict }
    - { id: retro, scope: run, access: read-only, prompt: retro, phase: after-completion }
  completion:
    - { type: integration }
    - { type: outbound, actions: [push, draft-pr] }

policies:
  guard:
    rules:
      # Workers are denied secret files. Only the listed exceptions get through.
      deny-secret-files:
        checkpoints: [worktree.copy, worktree.tracked, scan.read, adapter.render, diff.path]
        match:
          paths:
            - .env
            - .env.*
            - "*.pem"
            - "*.key"
            - id_rsa*
            - id_ed25519*
            - .netrc
            - .npmrc
            - .pypirc
            - memory/
        except: [.env.example, .env.sample, .env.template]
        effect: deny

      # What happens to any other file. Every checkpoint needs a rule like this one, with
      # no match or except, so that a decision is never implied.
      allow-other-files:
        checkpoints: [worktree.copy, worktree.tracked, scan.read, adapter.render, diff.path]
        effect: allow

      # Credentials that never reach a Worker, whichever list names them. A Remote or deploy
      # config's credential names are refused as well. Every other name is allowed.
      deny-credential-env:
        checkpoints: [env.passthrough]
        match:
          paths:
            - GH_TOKEN
            - GITHUB_TOKEN
            - GH_ENTERPRISE_TOKEN
            - GITHUB_ENTERPRISE_TOKEN
            - SSH_AUTH_SOCK
            - FOREMAN_GITHUB_TOKEN
        effect: deny
      allow-other-env:
        checkpoints: [env.passthrough]
        effect: allow

      # A Task can't close without Evidence, unless the rule below says it's present.
      deny-close-without-evidence:
        checkpoints: [task.close]
        effect: deny
      allow-close-with-evidence:
        checkpoints: [task.close]
        match:
          facts: { evidence: present }
        effect: allow

      # Every Outbound Action waits for an Approval.
      require-approval-push:
        checkpoints: [outbound.push]
        effect: require-approval
      require-approval-pr:
        checkpoints: [outbound.pr, outbound.draft-pr]
        effect: require-approval
      require-approval-merge:
        checkpoints: [outbound.merge]
        effect: require-approval
      require-approval-deploy:
        checkpoints: [outbound.deploy]
        effect: require-approval

    # A Worker's environment is built from these names, never inherited.
    env:
      allow: [PATH, LANG, "LC_*", TERM, TMPDIR, HOME]

    git:
      # Foreman's own git commands override these, since a Worker can set them in the shared
      # config to run code with Foreman's privileges.
      overrides:
        - core.hooksPath=/dev/null
        - core.fsmonitor=false
        - core.pager=cat
        - core.sshCommand=ssh
      # In a Worker's environment these hooks fail, and every other hook runs the Project's own.
      workerRejectedHooks: [pre-push]
      workerEnv:
        GIT_TERMINAL_PROMPT: "0"
      emptyDirEnv: [GH_CONFIG_DIR]

  sandbox: none

  # Propose Mode for every repository, unless `repositories` names it.
  repositoryDefaults:
    mode: propose
    allow: []
  repositories: {}

approvals:
  ownerAlias: operator
  expiryHours: 24
  # A Worker's message never counts as an Approval.
  acceptAgentMessages: false
  github:
    enabled: false
    allowlist: []

polling:
  enabled: false
  intervalSeconds: 300

lessons:
  topK: 5
  tokenCap: 1500
  minOccurrences: 2

router:
  answerFromDecisions: false
  decisionFiles: []

limits:
  maxActiveWorkers: 3
  maxRounds: 3
  workerTimeoutMinutes: 60
